services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: cyber-lab-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  webgoat:
    image: webgoat/webgoat:latest
    container_name: cyber-lab-webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
